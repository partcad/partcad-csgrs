# A release of this package's programs: `csgrs-partcad` and `hyperdrc`, built
# for every platform PartCAD runs on, in one archive each, with the checksums
# `csgrs_tool.py` verifies a download against.
#
# A release is a version: a push to main whose version (`cli/Cargo.toml`, and
# `csgrs_tool.py`, which has to agree) has no release yet builds one and
# publishes it as `v<version>`, tag included. Every other push to main is a
# check that takes seconds. See README.md, "Releasing".
name: Release

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: never

jobs:
  plan:
    name: "Is this version released?"
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.VERSION }}
      publish: ${{ steps.released.outputs.PUBLISH }}
    steps:
      - uses: actions/checkout@v5

      - name: The version the package says
        id: version
        run: |
          set -eu
          CRATE="$(grep -m1 '^version = ' cli/Cargo.toml | cut -d'"' -f2)"
          TOOL="$(grep -m1 '^VERSION = ' csgrs_tool.py | cut -d'"' -f2)"
          if [ "${CRATE}" != "${TOOL}" ]; then
            echo "cli/Cargo.toml says ${CRATE} and csgrs_tool.py ${TOOL}; they have to agree." >&2
            exit 1
          fi
          echo "VERSION=${CRATE}" >> "${GITHUB_OUTPUT}"

      - name: Whether it has a release
        id: released
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.VERSION }}
        run: |
          if gh release view "v${VERSION}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            echo "v${VERSION} is released; nothing to build."
            echo "PUBLISH=false" >> "${GITHUB_OUTPUT}"
          else
            echo "v${VERSION} has no release; building one."
            echo "PUBLISH=true" >> "${GITHUB_OUTPUT}"
          fi

  build:
    name: "Build (${{ matrix.target }})"
    needs: plan
    if: needs.plan.outputs.publish == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # glibc as old as the oldest runner offers, so that the build runs on
          # the Debian of PartCAD's sandbox image and on most distributions.
          - { os: ubuntu-22.04, target: x86_64-unknown-linux-gnu, archive: tar.gz }
          - { os: ubuntu-22.04-arm, target: aarch64-unknown-linux-gnu, archive: tar.gz }
          - { os: macos-15, target: aarch64-apple-darwin, archive: tar.gz }
          - { os: macos-15, target: x86_64-apple-darwin, archive: tar.gz }
          - { os: windows-2025, target: x86_64-pc-windows-msvc, archive: zip }
    steps:
      - uses: actions/checkout@v5

      - name: The version
        shell: bash
        run: echo "VERSION=${{ needs.plan.outputs.version }}" >> "${GITHUB_ENV}"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build
        shell: bash
        run: |
          set -eu
          REV="$(grep -m1 -o 'rev = "[0-9a-f]\{40\}"' cli/Cargo.toml | cut -d'"' -f2)"
          cargo build --manifest-path cli/Cargo.toml --release --locked --target "${{ matrix.target }}"
          cargo install hyperdrc --locked --git https://github.com/timschmidt/csgrs --rev "${REV}" \
            --target "${{ matrix.target }}" --root "${RUNNER_TEMP}/hyperdrc"

      - name: Package
        shell: bash
        run: |
          set -eu
          EXE=""
          if [ "${{ matrix.archive }}" = "zip" ]; then EXE=".exe"; fi
          NAME="csgrs-partcad-${VERSION}-${{ matrix.target }}"
          mkdir -p "dist/${NAME}"
          cp "cli/target/${{ matrix.target }}/release/csgrs-partcad${EXE}" "${RUNNER_TEMP}/hyperdrc/bin/hyperdrc${EXE}" "dist/${NAME}/"
          cp LICENSE.txt "dist/${NAME}/LICENSE.txt"
          REV="$(grep -m1 -o 'rev = "[0-9a-f]\{40\}"' cli/Cargo.toml | cut -d'"' -f2)"
          curl -fsSL "https://raw.githubusercontent.com/timschmidt/csgrs/${REV}/LICENSE" -o "dist/${NAME}/LICENSE-csgrs.txt"
          {
            echo "csgrs-partcad ${VERSION}, built from https://github.com/partcad/partcad-csgrs at ${GITHUB_SHA}"
            echo "csgrs and hyperdrc at https://github.com/timschmidt/csgrs/tree/${REV}"
          } > "dist/${NAME}/BUILD.txt"
          cd dist
          if [ "${{ matrix.archive }}" = "zip" ]; then
            7z a -tzip "${NAME}.zip" "${NAME}" >/dev/null
          else
            tar -czf "${NAME}.tar.gz" "${NAME}"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: dist/*.${{ matrix.archive }}

  publish:
    name: "Publish the release"
    needs: [plan, build]
    # Whatever built: a platform whose build failed is one ASSETS leaves out
    # until the next release, not a reason to withhold every other one.
    if: ${{ !cancelled() && needs.plan.outputs.publish == 'true' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: |
          cd dist
          sha256sum -- * > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - name: Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: v${{ needs.plan.outputs.version }}
        run: |
          # The tag is made here, at the commit that was built.
          gh release create "${TAG}" dist/* \
            --repo "${GITHUB_REPOSITORY}" \
            --target "${GITHUB_SHA}" \
            --title "${TAG}" \
            --notes "csgrs-partcad and hyperdrc, built from csgrs at the commit cli/Cargo.toml pins. Put each archive's SHA-256 (SHA256SUMS.txt) into ASSETS in csgrs_tool.py."
